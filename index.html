<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEPTUNE READS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #0b0e12;
      --card: #12161c;
      --incoming: #2f3336;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --text: #e7e9ea;
      --muted: #71767b;
      --line: #242a32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }

    .nr-shell {
      max-width: 700px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    /* Sticky Top Bar with 5 Navigation Icons at the Top */
    .nr-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(11, 14, 18, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nr-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
    }

    .nr-brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nr-drawer-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
    }

    .nr-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      color: var(--text);
      text-decoration: none;
    }

    .nr-brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--accent);
      color: #ffffff;
      display: inline-grid;
      place-items: center;
      font-size: 0.76rem;
      font-weight: 800;
    }

    .nr-account-pill {
      font-size: 0.8rem;
      color: var(--text);
      padding: 4px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      font-weight: 600;
    }

    .nr-nav-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .nr-nav-btn {
      position: relative;
      height: 45px;
      background: transparent;
      border: 0;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .nr-nav-btn.is-active {
      color: var(--text);
    }

    .nr-nav-btn.is-active::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 42px;
      height: 3px;
      border-radius: 999px 999px 0 0;
      background: var(--accent);
    }

    .nr-nav-badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 17px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
    }

    /* Mobile Drawer */
    .nr-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.72);
    }

    .nr-backdrop.is-open {
      display: block;
    }

    .nr-drawer {
      width: 260px;
      height: 100%;
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nr-drawer-head {
      font-weight: 800;
      font-size: 0.98rem;
      padding-bottom: 10px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .nr-drawer-item {
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 0.92rem;
      cursor: pointer;
    }

    .nr-drawer-item:hover {
      background: var(--card);
    }

    /* Main Pages */
    .nr-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .nr-page {
      display: none;
      padding: 16px 14px 28px;
    }

    .nr-page.is-active {
      display: block;
    }

    .nr-page.is-dm {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 0;
    }

    .nr-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .nr-subtabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .nr-subtab {
      padding: 10px 6px;
      background: transparent;
      border: 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      position: relative;
    }

    .nr-subtab.is-active {
      color: var(--text);
    }

    .nr-subtab.is-active::after {
      content: "";
      position: absolute;
      left: 16%;
      right: 16%;
      bottom: 0;
      height: 3px;
      border-radius: 999px 999px 0 0;
      background: var(--accent);
    }

    .nr-search {
      width: 100%;
      height: 42px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 0.92rem;
      margin-bottom: 14px;
      outline: none;
    }

    .nr-search:focus {
      border-color: var(--accent);
    }

    .nr-user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--card);
      margin-bottom: 10px;
    }

    .nr-user-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .nr-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1b222c;
      color: var(--text);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.92rem;
      flex-shrink: 0;
      object-fit: cover;
    }

    .nr-user-meta {
      min-width: 0;
    }

    .nr-user-name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nr-user-handle {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .nr-user-followers {
      font-size: 0.78rem;
      color: #a8b0b8;
      margin-top: 2px;
    }

    .nr-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .nr-btn {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid #536471;
      background: transparent;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .nr-btn.is-following {
      background: #eff3f4;
      color: #0f1419;
      border-color: #eff3f4;
    }

    .nr-btn-blue {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .nr-btn-blue:hover {
      background: var(--accent-hover);
    }

    /* Mature X-Style DM Thread */
    .nr-dm {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: calc(100dvh - 88px);
    }

    .nr-dm-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .nr-dm-peer-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .nr-back-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: transparent;
      border: 0;
      color: var(--text);
      font-size: 1.15rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .nr-back-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .nr-dm-peer-name {
      font-weight: 700;
      font-size: 0.98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nr-dm-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
    }

    .nr-dm-profile-summary {
      text-align: center;
      padding-bottom: 20px;
      margin-bottom: 14px;
      border-bottom: 1px solid #181c20;
    }

    .nr-dm-joined {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .nr-dm-followers {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .nr-dm-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nr-dm-time {
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
      margin: 10px 0 4px;
    }

    .nr-msg-row {
      display: flex;
      flex-direction: column;
    }

    .nr-msg-row.in {
      align-items: flex-start;
    }

    .nr-msg-row.out {
      align-items: flex-end;
    }

    .nr-link-preview {
      display: inline-block;
      margin-bottom: 4px;
      padding: 9px 13px;
      border-radius: 14px;
      background: #16181c;
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      max-width: 78%;
      word-break: break-all;
    }

    .nr-bubble {
      max-width: 78%;
      padding: 10px 15px;
      border-radius: 20px;
      font-size: 0.94rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .nr-msg-row.in .nr-bubble {
      background: var(--incoming);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    .nr-msg-row.out .nr-bubble {
      background: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 5px;
    }

    .nr-status {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
      padding-right: 4px;
    }

    .nr-dm-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .nr-dm-input {
      flex: 1;
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    .nr-dm-input:focus {
      border-color: var(--accent);
    }

    .nr-empty {
      color: var(--muted);
      font-size: 0.88rem;
      padding: 12px 0;
    }

    .nr-toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%) translateY(16px);
      z-index: 80;
      background: #161b22;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: 90vw;
      text-align: center;
    }

    .nr-toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="nr-shell">
    <header class="nr-header">
      <div class="nr-header-top">
        <div class="nr-brand-group">
          <button type="button" class="nr-drawer-btn" id="nrMenuBtn" aria-label="Menu">&#9776;</button>
          <a href="#home" class="nr-brand" id="nrHomeBrand">
            <span class="nr-brand-icon">NR</span>
            <span>NEPTUNE READS</span>
          </a>
        </div>
        <span class="nr-account-pill" id="nrAccountTag">Not signed in</span>
      </div>

      <nav class="nr-nav-row" aria-label="Primary top navigation">
        <button type="button" class="nr-nav-btn is-active" data-tab="home" aria-label="Home">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M12 3.1 2.5 11h2.2v9.5h5.6v-6h3.4v6h5.6V11h2.2L12 3.1z"/>
          </svg>
        </button>

        <button type="button" class="nr-nav-btn" data-tab="search" aria-label="Find Readers">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
        </button>

        <button type="button" class="nr-nav-btn" data-tab="following" aria-label="Following">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M4 6h16M4 12h11M4 18h16"/>
          </svg>
        </button>

        <button type="button" class="nr-nav-btn" data-tab="notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="nr-nav-badge" id="nrNotifBadge" style="display: none;">0</span>
        </button>

        <button type="button" class="nr-nav-btn" data-tab="messages" aria-label="Messages">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
      </nav>
    </header>

    <div class="nr-backdrop" id="nrBackdrop">
      <aside class="nr-drawer" aria-label="Navigation menu">
        <div class="nr-drawer-head">NEPTUNE READS</div>
        <button type="button" class="nr-drawer-item" data-drawer-tab="home">Home</button>
        <button type="button" class="nr-drawer-item" data-drawer-tab="search">Find Readers</button>
        <button type="button" class="nr-drawer-item" data-drawer-tab="following">Following</button>
        <button type="button" class="nr-drawer-item" data-drawer-tab="notifications">Notifications</button>
        <button type="button" class="nr-drawer-item" data-drawer-tab="messages">Messages</button>
      </aside>
    </div>

    <main class="nr-main">
      <!-- HOME -->
      <section class="nr-page is-active" id="tab-home">
        <h1 class="nr-title">Neptune Reads</h1>
        <p class="nr-empty" id="nrHomeStatus">Loading real readers from Supabase...</p>
        <div id="nrHomeReaders"></div>
      </section>

      <!-- SEARCH / FIND READERS -->
      <section class="nr-page" id="tab-search">
        <h1 class="nr-title">Find Readers</h1>
        <input
          type="search"
          class="nr-search"
          id="nrSearchInput"
          placeholder="Search people by name or @username..."
          autocomplete="off"
        />
        <div id="nrSearchResults"></div>
      </section>

      <!-- FOLLOWING -->
      <section class="nr-page" id="tab-following">
        <h1 class="nr-title">Following</h1>
        <div id="nrFollowingList"></div>
      </section>

      <!-- NOTIFICATIONS -->
      <section class="nr-page" id="tab-notifications">
        <h1 class="nr-title">Notifications</h1>
        <div id="nrNotifList">
          <p class="nr-empty">No incoming requests right now.</p>
        </div>
      </section>

      <!-- MESSAGES (CHATS / REQUESTS / FIND READERS + X-STYLE DM THREAD) -->
      <section class="nr-page" id="tab-messages">
        <div id="nrChatDirectory">
          <h1 class="nr-title">Messages</h1>
          <div class="nr-subtabs">
            <button type="button" class="nr-subtab is-active" data-msg-sub="chats">Chats</button>
            <button type="button" class="nr-subtab" data-msg-sub="requests">Requests</button>
            <button type="button" class="nr-subtab" data-msg-sub="find">Find Readers</button>
          </div>
          <div id="nrMsgSubContent"></div>
        </div>

        <div class="nr-dm" id="nrDmView" style="display: none;">
          <div class="nr-dm-top">
            <div class="nr-dm-peer-wrap">
              <button type="button" class="nr-back-btn" id="nrDmBack" aria-label="Back">&#8592;</button>
              <span class="nr-dm-peer-name" id="nrDmPeerName">Reader</span>
            </div>
            <button type="button" class="nr-btn" id="nrDmFollowBtn">Follow</button>
          </div>

          <div class="nr-dm-body" id="nrDmBody">
            <div class="nr-dm-profile-summary">
              <div class="nr-dm-joined" id="nrDmJoined"></div>
              <div class="nr-dm-followers" id="nrDmFollowers">0 Followers</div>
              <button type="button" class="nr-btn" id="nrDmProfileBtn">View Profile</button>
            </div>
            <div class="nr-dm-list" id="nrDmMessages"></div>
          </div>

          <form class="nr-dm-form" id="nrDmForm">
            <button type="button" class="nr-back-btn" id="nrAddLinkBtn" aria-label="Insert link">+</button>
            <input
              type="text"
              class="nr-dm-input"
              id="nrDmInput"
              placeholder="Message"
              autocomplete="off"
              required
            />
            <button type="submit" class="nr-btn nr-btn-blue">Send</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div class="nr-toast" id="nrToast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const SUPABASE_URL = "https://wswhddksvlcodtwilxaf.supabase.co";
      const SUPABASE_ANON_KEY = "Sb_publishable_iFkRGRCD_Ki7czkC292-fg_hbqInZlO";

      const sb =
        SUPABASE_ANON_KEY && typeof window.supabase !== "undefined"
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
          : null;

      const state = {
        userId: null,
        profiles: [],
        followingSet: new Set(),
        requests: [],
        msgSubTab: "chats",
        activePeerId: null
      };

      const toastEl = document.getElementById("nrToast");
      let toastTimer = null;
      function showToast(text) {
        toastEl.textContent = text;
        toastEl.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("is-visible"), 2600);
      }

      function formatFollowers(count) {
        const n = Number(count) || 0;
        if (n >= 1000000) return `${(n / 1000000).toFixed(1).replace(/\.0$/, "")}M Followers`;
        if (n >= 1000) return `${(n / 1000).toFixed(1).replace(/\.0$/, "")}K Followers`;
        return `${n} ${n === 1 ? "Follower" : "Followers"}`;
      }

      function formatJoined(isoDate) {
        if (!isoDate) return "";
        const d = new Date(isoDate);
        if (Number.isNaN(d.getTime())) return "";
        return `Joined ${d.toLocaleDateString("en-US", { month: "long", year: "numeric" })}`;
      }

      // Navigation & Drawer
      const tabButtons = document.querySelectorAll(".nr-nav-btn[data-tab]");
      const pages = document.querySelectorAll(".nr-page");
      const messagesPage = document.getElementById("tab-messages");

      function setTab(tabName) {
        tabButtons.forEach((b) => b.classList.toggle("is-active", b.dataset.tab === tabName));
        pages.forEach((p) => p.classList.toggle("is-active", p.id === `tab-${tabName}`));
        messagesPage.classList.toggle("is-dm", tabName === "messages" && Boolean(state.activePeerId));
      }

      tabButtons.forEach((btn) => btn.addEventListener("click", () => setTab(btn.dataset.tab)));
      document.getElementById("nrHomeBrand").addEventListener("click", (e) => {
        e.preventDefault();
        setTab("home");
      });

      const backdrop = document.getElementById("nrBackdrop");
      document.getElementById("nrMenuBtn").addEventListener("click", () => backdrop.classList.add("is-open"));
      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) backdrop.classList.remove("is-open");
      });
      document.querySelectorAll("[data-drawer-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          backdrop.classList.remove("is-open");
          setTab(btn.dataset.drawerTab);
        });
      });

      document.querySelectorAll(".nr-subtab[data-msg-sub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".nr-subtab").forEach((b) => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          state.msgSubTab = btn.dataset.msgSub;
          renderMessagesSubTab();
        });
      });

      async function fetchFollowerCount(userId) {
        if (!sb || !userId) return 0;
        const { data } = await sb.rpc("get_reader_follow_stats", { target_user_id: userId });
        const row = Array.isArray(data) ? data[0] : data;
        return Number(row?.followers_count ?? 0);
      }

      async function loadAllRealData() {
        const homeStatus = document.getElementById("nrHomeStatus");
        if (!sb) {
          homeStatus.textContent = "Supabase client failed to initialize.";
          return;
        }

        const { data: { session } } = await sb.auth.getSession();
        state.userId = session?.user?.id || null;

        const { data: rows, error } = await sb
          .from("reader_profiles")
          .select("id, full_name, username, created_at")
          .limit(100);

        if (error) {
          homeStatus.textContent = `Error loading profiles: ${error.message}`;
          return;
        }

        const rawList = Array.isArray(rows) ? rows : [];
        state.profiles = await Promise.all(
          rawList.map(async (p) => ({
            ...p,
            followers_count: await fetchFollowerCount(p.id)
          }))
        );

        if (state.userId) {
          const me = state.profiles.find((p) => p.id === state.userId);
          document.getElementById("nrAccountTag").textContent = me?.username ? `@${me.username}` : "Signed in";

          const [{ data: follows }, { data: reqs }] = await Promise.all([
            sb.from("reader_follows").select("following_id").eq("follower_id", state.userId),
            sb
              .from("friend_requests")
              .select("id, sender_id, receiver_id, status")
              .or(`sender_id.eq.${state.userId},receiver_id.eq.${state.userId}`)
          ]);

          state.followingSet = new Set((follows || []).map((f) => f.following_id));
          state.requests = Array.isArray(reqs) ? reqs : [];

          const incomingPending = state.requests.filter(
            (r) => r.receiver_id === state.userId && r.status === "pending"
          );
          const badge = document.getElementById("nrNotifBadge");
          if (incomingPending.length > 0) {
            badge.style.display = "inline-block";
            badge.textContent = String(incomingPending.length);
          } else {
            badge.style.display = "none";
          }
        }

        homeStatus.textContent =
          state.profiles.length > 0
            ? `${state.profiles.length} readers on Neptune Reads`
            : "No readers registered yet.";

        renderAll();
      }

      function buildReaderRow(person, mode = "default") {
        const card = document.createElement("div");
        card.className = "nr-user-card";

        const name = person.full_name || person.username || "Reader";
        const handle = (person.username || "").replace(/^@+/, "");
        const isFollowing = state.followingSet.has(person.id);

        const left = document.createElement("div");
        left.className = "nr-user-left";
        left.innerHTML = `
          <div class="nr-avatar"></div>
          <div class="nr-user-meta">
            <div class="nr-user-name"></div>
            <div class="nr-user-handle"></div>
            <div class="nr-user-followers"></div>
          </div>
        `;
        left.querySelector(".nr-avatar").textContent = name.charAt(0).toUpperCase() || "R";
        left.querySelector(".nr-user-name").textContent = name;
        left.querySelector(".nr-user-handle").textContent = handle ? `@${handle}` : "";
        left.querySelector(".nr-user-followers").textContent = formatFollowers(person.followers_count);
        left.addEventListener("click", () => openThread(person.id));

        const actions = document.createElement("div");
        actions.className = "nr-actions";

        if (state.userId && state.userId !== person.id) {
          const followBtn = document.createElement("button");
          followBtn.type = "button";
          followBtn.className = `nr-btn ${isFollowing ? "is-following" : ""}`;
          followBtn.textContent = isFollowing ? "Following" : "Follow";
          followBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleFollow(person.id);
          });
          actions.appendChild(followBtn);

          if (mode === "find") {
            const existingReq = state.requests.find(
              (r) =>
                (r.sender_id === state.userId && r.receiver_id === person.id) ||
                (r.receiver_id === state.userId && r.sender_id === person.id)
            );
            const reqBtn = document.createElement("button");
            reqBtn.type = "button";
            reqBtn.className = "nr-btn";
            reqBtn.textContent = existingReq ? (existingReq.status === "accepted" ? "Connected" : "Requested") : "Add";
            reqBtn.disabled = Boolean(existingReq);
            reqBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              sendRequest(person.id);
            });
            actions.appendChild(reqBtn);
          }

          const msgBtn = document.createElement("button");
          msgBtn.type = "button";
          msgBtn.className = "nr-btn nr-btn-blue";
          msgBtn.textContent = "Message";
          msgBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openThread(person.id);
          });
          actions.appendChild(msgBtn);
        }

        card.appendChild(left);
        card.appendChild(actions);
        return card;
      }

      function renderMessagesSubTab() {
        const container = document.getElementById("nrMsgSubContent");
        container.innerHTML = "";

        const otherProfiles = state.profiles.filter((p) => p.id !== state.userId);

        if (state.msgSubTab === "chats") {
          const acceptedIds = new Set(
            state.requests
              .filter((r) => r.status === "accepted")
              .map((r) => (r.sender_id === state.userId ? r.receiver_id : r.sender_id))
          );
          const list = acceptedIds.size > 0
            ? otherProfiles.filter((p) => acceptedIds.has(p.id))
            : otherProfiles;

          if (list.length === 0) {
            container.innerHTML = `<p class="nr-empty">No conversations yet.</p>`;
            return;
          }
          list.forEach((p) => container.appendChild(buildReaderRow(p, "chats")));
        } else if (state.msgSubTab === "requests") {
          const pending = state.requests.filter(
            (r) => r.receiver_id === state.userId && r.status === "pending"
          );
          if (pending.length === 0) {
            container.innerHTML = `<p class="nr-empty">No pending requests.</p>`;
            return;
          }
          pending.forEach((req) => {
            const sender = state.profiles.find((p) => p.id === req.sender_id);
            if (!sender) return;
            const row = buildReaderRow(sender, "requests");
            const acceptBtn = document.createElement("button");
            acceptBtn.type = "button";
            acceptBtn.className = "nr-btn nr-btn-blue";
            acceptBtn.textContent = "Accept";
            acceptBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              acceptRequest(req.id);
            });
            row.querySelector(".nr-actions").prepend(acceptBtn);
            container.appendChild(row);
          });
        } else {
          if (otherProfiles.length === 0) {
            container.innerHTML = `<p class="nr-empty">No other readers found.</p>`;
            return;
          }
          otherProfiles.forEach((p) => container.appendChild(buildReaderRow(p, "find")));
        }
      }

      function renderAll(queryText = "") {
        const q = queryText.trim().replace(/^@+/, "").toLowerCase();
        const homeBox = document.getElementById("nrHomeReaders");
        const searchBox = document.getElementById("nrSearchResults");
        const followingBox = document.getElementById("nrFollowingList");

        homeBox.innerHTML = "";
        searchBox.innerHTML = "";
        followingBox.innerHTML = "";

        state.profiles.forEach((p) => homeBox.appendChild(buildReaderRow(p)));

        const matched = state.profiles.filter((p) => {
          if (!q) return true;
          return (
            (p.full_name || "").toLowerCase().includes(q) ||
            (p.username || "").toLowerCase().includes(q)
          );
        });

        if (matched.length === 0) {
          searchBox.innerHTML = `<p class="nr-empty">No results for "${queryText}"</p>`;
        } else {
          matched.forEach((p) => searchBox.appendChild(buildReaderRow(p, "find")));
        }

        const followed = state.profiles.filter((p) => state.followingSet.has(p.id));
        if (followed.length === 0) {
          followingBox.innerHTML = `<p class="nr-empty">You are not following anyone yet.</p>`;
        } else {
          followed.forEach((p) => followingBox.appendChild(buildReaderRow(p)));
        }

        renderMessagesSubTab();

        if (state.activePeerId) {
          const activePeer = state.profiles.find((p) => p.id === state.activePeerId);
          if (activePeer) renderThreadHeader(activePeer);
        }
      }

      document.getElementById("nrSearchInput").addEventListener("input", (e) => {
        renderAll(e.target.value);
      });

      async function sendRequest(receiverId) {
        if (!sb || !state.userId) return;
        const { error } = await sb.from("friend_requests").insert({
          sender_id: state.userId,
          receiver_id: receiverId,
          status: "pending"
        });
        if (error) {
          showToast(error.message);
          return;
        }
        showToast("Request sent");
        await loadAllRealData();
      }

      async function acceptRequest(requestId) {
        if (!sb || !state.userId) return;
        const { error } = await sb
          .from("friend_requests")
          .update({ status: "accepted" })
          .eq("id", requestId);
        if (error) {
          showToast(error.message);
          return;
        }
        showToast("Request accepted");
        await loadAllRealData();
      }

      async function toggleFollow(targetId) {
        if (!sb || !state.userId || state.userId === targetId) return;
        const target = state.profiles.find((p) => p.id === targetId);
        if (!target) return;

        const isFollowing = state.followingSet.has(targetId);
        if (isFollowing) {
          const { error } = await sb
            .from("reader_follows")
            .delete()
            .eq("follower_id", state.userId)
            .eq("following_id", targetId);
          if (error) return showToast(error.message);
          state.followingSet.delete(targetId);
        } else {
          const { error } = await sb
            .from("reader_follows")
            .insert({ follower_id: state.userId, following_id: targetId });
          if (error) return showToast(error.message);
          state.followingSet.add(targetId);
        }

        target.followers_count = await fetchFollowerCount(targetId);
        renderAll(document.getElementById("nrSearchInput").value);
      }

      function renderThreadHeader(peer) {
        const isFollowing = state.followingSet.has(peer.id);
        document.getElementById("nrDmPeerName").textContent = peer.full_name || peer.username || "Reader";
        document.getElementById("nrDmJoined").textContent = formatJoined(peer.created_at);
        document.getElementById("nrDmFollowers").textContent = formatFollowers(peer.followers_count);

        const followBtn = document.getElementById("nrDmFollowBtn");
        followBtn.style.display = state.userId && state.userId !== peer.id ? "inline-block" : "none";
        followBtn.textContent = isFollowing ? "Following" : "Follow";
        followBtn.classList.toggle("is-following", isFollowing);
      }

      async function openThread(peerId) {
        const peer = state.profiles.find((p) => p.id === peerId);
        if (!peer) return;

        state.activePeerId = peerId;
        document.getElementById("nrChatDirectory").style.display = "none";
        document.getElementById("nrDmView").style.display = "flex";
        setTab("messages");
        renderThreadHeader(peer);

        const listEl = document.getElementById("nrDmMessages");
        listEl.innerHTML = "";

        if (!sb || !state.userId) {
          listEl.innerHTML = `<p class="nr-empty">Sign in to read and send messages.</p>`;
          return;
        }

        const { data: msgs, error } = await sb
          .from("direct_messages")
          .select("id, sender_id, receiver_id, body, created_at")
          .or(
            `and(sender_id.eq.${state.userId},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${state.userId})`
          )
          .order("created_at", { ascending: true });

        if (error) {
          listEl.innerHTML = `<p class="nr-empty">${error.message}</p>`;
          return;
        }

        if (!msgs || msgs.length === 0) {
          listEl.innerHTML = `<p class="nr-empty">No messages yet.</p>`;
          return;
        }

        const timeDiv = document.createElement("div");
        timeDiv.className = "nr-dm-time";
        timeDiv.textContent = new Date(msgs[msgs.length - 1].created_at).toLocaleString();
        listEl.appendChild(timeDiv);

        msgs.forEach((m) => {
          const outgoing = m.sender_id === state.userId;
          const row = document.createElement("div");
          row.className = `nr-msg-row ${outgoing ? "out" : "in"}`;

          const urlMatch = String(m.body || "").match(/https?:\/\/[^\s]+/i);
          if (urlMatch) {
            const link = document.createElement("a");
            link.className = "nr-link-preview";
            link.href = urlMatch[0];
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = urlMatch[0];
            row.appendChild(link);
          }

          const bubble = document.createElement("div");
          bubble.className = "nr-bubble";
          bubble.textContent = m.body;
          row.appendChild(bubble);

          if (outgoing) {
            const st = document.createElement("div");
            st.className = "nr-status";
            st.textContent = "Sent";
            row.appendChild(st);
          }

          listEl.appendChild(row);
        });

        const bodyEl = document.getElementById("nrDmBody");
        bodyEl.scrollTop = bodyEl.scrollHeight;
      }

      document.getElementById("nrDmBack").addEventListener("click", () => {
        state.activePeerId = null;
        document.getElementById("nrDmView").style.display = "none";
        document.getElementById("nrChatDirectory").style.display = "block";
        messagesPage.classList.remove("is-dm");
      });

      document.getElementById("nrDmFollowBtn").addEventListener("click", () => {
        if (state.activePeerId) toggleFollow(state.activePeerId);
      });

      document.getElementById("nrDmProfileBtn").addEventListener("click", () => {
        const peer = state.profiles.find((p) => p.id === state.activePeerId);
        if (!peer) return;
        showToast(`${peer.full_name || peer.username} (@${peer.username || "reader"}) · ${formatFollowers(peer.followers_count)}`);
      });

      document.getElementById("nrAddLinkBtn").addEventListener("click", () => {
        const input = document.getElementById("nrDmInput");
        const url = prompt("Paste link:");
        if (url && url.trim()) {
          input.value = `${input.value ? input.value + " " : ""}${url.trim()}`;
          input.focus();
        }
      });

      document.getElementById("nrDmForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("nrDmInput");
        const text = input.value.trim();
        if (!text || !state.activePeerId || !sb || !state.userId) return;

        input.value = "";
        const { error } = await sb.from("direct_messages").insert({
          sender_id: state.userId,
          receiver_id: state.activePeerId,
          body: text
        });

        if (error) {
          showToast(error.message);
          return;
        }

        await openThread(state.activePeerId);
      });

      loadAllRealData();
    })();
  </script>
</body>
</html>
